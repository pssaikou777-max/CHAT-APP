{% extends "base.html" %}
{% block title %}トーク — FreeChat{% endblock %}
{% block body %}
<div class="app-wrap">

  <header class="top-bar">
    <span class="top-bar__title">トーク</span>
  </header>

  <ul id="talkList" class="talk-list">
    <li class="empty-msg" id="emptyMsg">まだトークがありません</li>
  </ul>

  <nav class="bottom-nav">
    <a class="nav-item" href="{{ url_for('chat.friends') }}">
      <span class="nav-icon">👥</span><span class="nav-label">友達</span>
    </a>
    <a class="nav-item active" href="{{ url_for('chat.talks') }}">
      <span class="nav-icon">💬</span><span class="nav-label">トーク</span>
    </a>
    <a class="nav-item" href="{{ url_for('auth.logout') }}">
      <span class="nav-icon">⚙️</span><span class="nav-label">設定</span>
    </a>
  </nav>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadTalks() {
  const res  = await fetch("/api/talks");
  const data = await res.json();
  const ul   = document.getElementById("talkList");
  const em   = document.getElementById("emptyMsg");
  if (!data.length) return;
  em.remove();
  data.forEach(t => {
    const d   = new Date(t.last_at);
    const time = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    ul.insertAdjacentHTML("beforeend", `
      <li class="talk-item" onclick="location.href='/chat/${t.partner.id}'">
        <div class="talk-avatar">${t.partner.nickname[0]}</div>
        <div class="talk-body">
          <div class="talk-header">
            <span class="talk-name">${t.partner.nickname}</span>
            <span class="talk-time">${time}</span>
          </div>
          <div class="talk-preview">${escHtml(t.last_msg)}</div>
        </div>
        ${t.unread > 0 ? `<span class="badge-unread">${t.unread}</span>` : ""}
      </li>`);
  });
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadTalks();
</script>
{% endblock %}
