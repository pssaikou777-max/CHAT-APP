<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ログイン — FreeChat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; color: #eee; font-family: sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #2a2a2a; border-radius: 12px; padding: 40px; width: 100%; max-width: 360px; }
  h1 { text-align: center; margin-bottom: 24px; font-size: 1.3rem; }
  .msg { padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: .9rem; }
  .msg.error { background: #5c1a1a; color: #f88; }
  input { width: 100%; padding: 12px; border-radius: 8px; border: none;
          background: #333; color: #eee; font-size: 1rem; margin-bottom: 16px; }
  button { width: 100%; padding: 12px; border-radius: 8px; border: none;
           background: #4caf50; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #43a047; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 管理者ログイン</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="msg {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <input type="password" name="password" placeholder="管理者パスワード" required autofocus>
    <button type="submit">ログイン</button>
  </form>
</div>
</body>
</html>
